<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UGC Studio – Connexion</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}
.container{
  background:#fff;
  border-radius:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
  padding:40px;
  width:100%;
  max-width:450px
}
.logo{
  width:80px;height:80px;
  background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  border-radius:50%;
  margin:0 auto 20px;
  display:flex;align-items:center;justify-content:center;
  font-size:40px
}
h1{text-align:center;font-size:32px;color:#1a202c;margin-bottom:10px}
.subtitle{text-align:center;color:#718096;margin-bottom:30px}
label{display:block;font-size:14px;font-weight:600;color:#4a5568;margin-bottom:8px}
input{
  width:100%;
  padding:14px 16px;
  border:2px solid #e2e8f0;
  border-radius:10px;
  font-size:16px;
  text-transform:uppercase;
  font-weight:600
}
button{
  width:100%;
  background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  color:#fff;
  font-weight:600;
  padding:14px;
  border-radius:10px;
  border:none;
  font-size:16px;
  cursor:pointer;
  margin-top:20px;
  transition:transform 0.2s;
}
button:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 20px rgba(102,126,234,0.3);
}
button:active{
  transform:translateY(0);
}
.info{
  margin-top:20px;
  text-align:center;
  font-size:13px;
  color:#718096
}
.quota-info{
  background:#edf2f7;
  padding:20px;
  border-radius:10px;
  margin-top:20px;
  text-align:center
}
.quota-number{
  font-size:48px;
  font-weight:bold;
  color:#48bb78
}
.countdown{
  margin-top:15px;
  padding:10px;
  background:#fff;
  border-radius:8px;
  font-size:14px;
  color:#4a5568;
}
</style>
</head>

<body>
<div class="container">
  <div id="app"></div>
</div>

<script>
const CONFIG = {
  // LIEN GOOGLE AI STUDIO DÉPLOYÉ
  ugcAppUrl: "https://ai.studio/apps/drive/1KtzQ6jT5IOTjnneTBUViVE82_mgGhs6w",
  dailyLimit: 10,
  adminCode: "ADMIN2024",
  studentCodes: [
    "MEL6A2","STE9Q4","CHR8P7","MAR9F4","VAN5Q8","CEL4M8","VAN8O3",
    "ALI6Y9","JOH7A4","AUR6R9","SAR7H2","VIR8G6","LIO5R8","ADE7L4",
    "SHA9R6","LAE6T9","MAR8T6","DIA7N5","ALI7C8","ERI6Y4","MARH9E",
    "MEL9N7","AUD7R5","FAN6N4","ALI8C5","STE4P8","AGN6S9","MAN7U9"
  ]
};

let usage = JSON.parse(localStorage.getItem("ugc_usage") || "{}");
let currentCode = null;
let redirectTimer = null;

function today(){ return new Date().toDateString(); }

function remainingQuota(code){
  if(!usage[code] || usage[code].date !== today()) return CONFIG.dailyLimit;
  return Math.max(0, CONFIG.dailyLimit - usage[code].count);
}

function consumeQuota(code){
  if(!usage[code] || usage[code].date !== today()){
    usage[code] = { date: today(), count: 0 };
  }
  usage[code].count++;
  localStorage.setItem("ugc_usage", JSON.stringify(usage));
}

function renderLogin(){
  document.getElementById("app").innerHTML = `
    <div class="logo">🎨</div>
    <h1>UGC Studio</h1>
    <p class="subtitle">Générateur d'images IA</p>
    <label>Code d'accès</label>
    <input id="codeInput" placeholder="Entrez votre code" onkeypress="if(event.key==='Enter')login()">
    <button onclick="login()">Se connecter</button>
    <div class="info">Utilisez le code fourni par votre enseignante</div>
  `;
  setTimeout(() => document.getElementById("codeInput")?.focus(), 100);
}

function renderStudent(){
  const r = remainingQuota(currentCode);
  document.getElementById("app").innerHTML = `
    <div class="quota-info">
      <h3>✅ Accès autorisé</h3>
      <div class="quota-number">${r}</div>
      <p style="margin-top:10px;color:#718096;font-weight:600">générations restantes aujourd'hui</p>
    </div>
    <button onclick="launch()">🚀 Lancer UGC Studio</button>
    <button onclick="logout()" style="background:#718096;margin-top:10px">
      ← Déconnexion
    </button>
  `;
}

function renderRedirecting(seconds){
  document.getElementById("app").innerHTML = `
    <div class="logo">🚀</div>
    <h1>Lancement en cours...</h1>
    <div class="quota-info">
      <p style="font-size:18px;color:#4a5568;margin-bottom:15px">
        Redirection vers UGC Studio dans
      </p>
      <div class="quota-number" style="font-size:72px;color:#667eea">${seconds}</div>
      <p style="margin-top:15px;color:#718096;font-size:14px">
        Une nouvelle fenêtre va s'ouvrir automatiquement
      </p>
      <div class="countdown">
        <strong>💡 Astuce :</strong> Autorisez les pop-ups si nécessaire
      </div>
    </div>
    <button onclick="cancelRedirect()" style="background:#718096">
      ✕ Annuler
    </button>
  `;
}

function login(){
  const code = document.getElementById("codeInput").value.trim().toUpperCase();
  if(!code) return alert("⚠️ Merci d'entrer un code d'accès");
  
  if(code === CONFIG.adminCode) {
    alert("✅ Connexion administrateur réussie");
    currentCode = code;
    renderStudent();
    return;
  }
  
  if(!CONFIG.studentCodes.includes(code)) {
    alert("❌ Code invalide. Vérifiez votre code auprès de votre enseignante.");
    return;
  }
  
  currentCode = code;
  renderStudent();
}

function launch(){
  const remaining = remainingQuota(currentCode);
  
  if(remaining <= 0) {
    alert("⚠️ Quota journalier atteint (10 générations max/jour).\n\nRevenez demain pour continuer ! 😊");
    return;
  }
  
  // Consommer le quota AVANT la redirection
  consumeQuota(currentCode);
  
  // Compte à rebours de 3 secondes
  let countdown = 3;
  renderRedirecting(countdown);
  
  redirectTimer = setInterval(() => {
    countdown--;
    if(countdown > 0) {
      renderRedirecting(countdown);
    } else {
      clearInterval(redirectTimer);
      // Ouvrir l'app dans un nouvel onglet
      window.open(CONFIG.ugcAppUrl, '_blank');
      // Retourner à l'écran quota
      renderStudent();
    }
  }, 1000);
}

function cancelRedirect(){
  if(redirectTimer) {
    clearInterval(redirectTimer);
    redirectTimer = null;
  }
  // Rembourser le quota (annulation)
  if(usage[currentCode]) {
    usage[currentCode].count = Math.max(0, usage[currentCode].count - 1);
    localStorage.setItem("ugc_usage", JSON.stringify(usage));
  }
  renderStudent();
}

function logout(){
  if(confirm("Êtes-vous sûr(e) de vouloir vous déconnecter ?")) {
    currentCode = null;
    if(redirectTimer) {
      clearInterval(redirectTimer);
      redirectTimer = null;
    }
    renderLogin();
  }
}

// Auto-start
renderLogin();
</script>
</body>
</html>
