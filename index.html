<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio UGC AI — iPhone 17 Pro Max Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* [Tes styles restent globalement les mêmes, j'ajoute juste les corrections de structure] */
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{
            --bg:#050505;--bg2:#0c0c0c;--glass:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.08);
            --purple:#a855f7;--pink:#ec4899;--indigo:#6366f1;--emerald:#10b981;--amber:#f59e0b;--red:#ef4444;--text:#fff;--text2:rgba(255,255,255,0.6);--text3:rgba(255,255,255,0.3);
        }
        body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
        /* ... [Je passe les styles CSS pour aller à l'essentiel du changement HTML/JS] ... */
        /* [Note : Garde tes styles précédents, ils sont superbes] */
        .card{background:var(--glass);border:1px solid var(--border);border-radius:1.5rem;padding:1.25rem;margin-bottom:1rem;}
        .pill-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem}
        .pill-btn{padding:0.6rem;border-radius:0.75rem;border:1px solid var(--border);background:var(--glass);color:var(--text2);font-size:0.65rem;cursor:pointer;text-transform:uppercase;font-weight:700;}
        .pill-btn.active{background:var(--purple);color:#fff;border-color:var(--purple);}
        .gen-btn{width:100%;padding:1.2rem;border-radius:1.25rem;background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;border:none;font-family:'Syne';font-weight:800;cursor:pointer;}
        .uploader{border:2px dashed var(--border);border-radius:1rem;padding:1rem;text-align:center;position:relative;margin-bottom:0.5rem;}
        .s-textarea{width:100%;background:var(--glass);border:1px solid var(--border);color:#fff;padding:0.75rem;border-radius:0.75rem;resize:none;}
    </style>
</head>
<body>

<div id="app" class="visible">
    <header style="padding:1rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
        <div style="font-family:'Syne';font-weight:800;letter-spacing:1px;">STUDIO UGC AI</div>
        <div id="quotaDisplay" style="font-size:0.7rem;color:var(--emerald);">10 GÉNÉRATIONS RESTANTES</div>
    </header>

    <div style="display:grid;grid-template-columns:380px 1fr;gap:1.5rem;padding:1.5rem;">
        
        <div class="sidebar">
            
            <div class="card">
                <div class="card-title" style="margin-bottom:1rem;font-size:0.7rem;text-transform:uppercase;letter-spacing:1px;">1. Références Réelles</div>
                <div class="uploader" id="av1Uploader">
                    <span style="font-size:0.7rem;">👤 Avatar Face</span>
                    <input type="file" style="position:absolute;inset:0;opacity:0;" onchange="handleUpload(event,'av1')">
                </div>
                <div class="uploader" id="prodUploader">
                    <span style="font-size:0.7rem;">📦 Produit (Étiquette nette)</span>
                    <input type="file" style="position:absolute;inset:0;opacity:0;" onchange="handleUpload(event,'prod')">
                </div>
            </div>

            <div class="card">
                <div class="card-title" style="margin-bottom:1rem;font-size:0.7rem;text-transform:uppercase;letter-spacing:1px;">2. Mise en Scène (Décor)</div>
                <div class="pill-grid" id="sceneGrid">
                    </div>
            </div>

            <div class="card">
                <div class="card-title" style="margin-bottom:1rem;font-size:0.7rem;text-transform:uppercase;letter-spacing:1px;">3. Éclairage iPhone</div>
                <div class="pill-grid">
                    <button class="pill-btn light-btn active" data-light="window" onclick="setLight('window')">☀️ Lumière Jour</button>
                    <button class="pill-btn light-btn" data-light="golden" onclick="setLight('golden')">🌅 Golden Hour</button>
                    <button class="pill-btn light-btn" data-light="bathroom" onclick="setLight('bathroom')">🛁 Salle de bain</button>
                    <button class="pill-btn light-btn" data-light="flash" onclick="setLight('flash')">📸 Flash direct</button>
                </div>
            </div>

            <div class="card">
                <div class="card-title" style="margin-bottom:1rem;font-size:0.7rem;text-transform:uppercase;letter-spacing:1px;">4. Action précise</div>
                <textarea class="s-textarea" id="actionText" placeholder="Ex: Elle applique la crème sur sa joue avec un sourire naturel..."></textarea>
            </div>

            <button class="gen-btn" id="genBtn" onclick="generate()">LANCER LE SHOOTING 4K</button>
        </div>

        <div class="gallery-col" id="galleryBody" style="background:rgba(0,0,0,0.2);border-radius:1.5rem;padding:1.5rem;min-height:80vh;">
            <div style="text-align:center;color:var(--text3);margin-top:200px;">Les photos apparaîtront ici...</div>
        </div>

    </div>
</div>

<script>
    // --- CONFIGURATION ---
    const state = {
        av1: '', prod: '',
        selectedScene: 'beaute',
        selectedLight: 'window',
        quotaUsed: 0,
        // MAPPING DES DÉCORS (C'est ici que la magie opère)
        sceneSettings: {
            beaute: { name: "Beauté", set: "salle de bain moderne, miroir, évier en marbre, serviettes blanches moelleuses" },
            mode: { name: "Mode", set: "dressing lumineux, portant à vêtements, miroir plein pied, tapis beige" },
            food: { name: "Food", set: "cuisine minimaliste, plan de travail en quartz, table de petit-déjeuner en bois clair" },
            sport: { name: "Sport", set: "salon spacieux avec tapis de yoga, bouteille d'eau, lumière matinale traversante" },
            maison: { name: "Lifestyle", set: "chambre cocooning, draps en lin blanc, plante verte (monstera) en arrière-plan" }
        },
        lightSettings: {
            window: "soft natural window light, subtle shadows, realistic day ambiance",
            golden: "warm sunset light, golden hour glow, cinematic long shadows",
            bathroom: "bright neutral bathroom lighting, realistic tile reflections",
            flash: "direct smartphone flash, high contrast, nightlife candid look"
        }
    };

    // --- INITIALISATION ---
    function init() {
        const grid = document.getElementById('sceneGrid');
        Object.keys(state.sceneSettings).forEach(key => {
            const btn = document.createElement('button');
            btn.className = `pill-btn scene-btn ${key === state.selectedScene ? 'active' : ''}`;
            btn.textContent = state.sceneSettings[key].name;
            btn.onclick = () => {
                document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.selectedScene = key;
            };
            grid.appendChild(btn);
        });
    }

    function setLight(light) {
        state.selectedLight = light;
        document.querySelectorAll('.light-btn').forEach(b => {
            b.classList.remove('active');
            if(b.dataset.light === light) b.classList.add('active');
        });
    }

    function handleUpload(e, type) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (event) => {
            state[type] = event.target.result.split(',')[1];
            document.getElementById(type + 'Uploader').style.borderColor = '#a855f7';
        };
        reader.readAsDataURL(file);
    }

    // --- LOGIQUE DU PROMPT NANO BANANA ---
    function buildUgcPrompt() {
        const sceneData = state.sceneSettings[state.selectedScene];
        const lightData = state.lightSettings[state.selectedLight];
        const action = document.getElementById('actionText').value || "regardant l'objectif avec naturel";

        // C'est ici qu'on force l'iPhone 17 Pro Max et le réalisme
        return `UGC Shot on iPhone 17 Pro Max, 48MP Fusion Camera. 
        AUTHENTICITY: Real skin texture, visible pores, no beauty filter, candid emotion.
        SETTING: Inside a ${sceneData.set}. 
        LIGHTING: ${lightData}.
        SUBJECT: The person from the reference photo, ${action}. 
        PRODUCT: High-detail [PRODUIT], sharp packaging, text on label is perfectly legible 4K.
        COMPOSITION: Natural handheld framing, slightly off-center for realism, depth of field.`;
    }

    async function generate() {
        if (!state.av1) return alert("Upload ton visage d'abord !");
        
        const btn = document.getElementById('genBtn');
        btn.disabled = true;
        btn.textContent = "CAPTURE EN COURS...";

        const prompt = buildUgcPrompt();
        console.log("Prompt envoyé :", prompt);

        // ICI TON APPEL API VERS TON SERVEUR CLOUD RUN
        // Je simule la réussite pour l'exemple
        setTimeout(() => {
            const gallery = document.getElementById('galleryBody');
            gallery.innerHTML = `
                <div style="background:var(--glass); padding:1rem; border-radius:1rem;">
                    <div style="font-size:0.6rem; color:var(--text3); margin-bottom:0.5rem;">PROMPT UTILISÉ : ${prompt}</div>
                    <div style="color:var(--emerald); font-weight:bold;">IMAGE GÉNÉRÉE AVEC SUCCÈS (SIMULATION)</div>
                </div>
            `;
            btn.disabled = false;
            btn.textContent = "LANCER LE SHOOTING 4K";
        }, 2000);
    }

    init();
</script>
</body>
</html>
