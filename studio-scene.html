<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Scène - Continuité Visuelle 4K</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            text-align: center;
            color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .app-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .iframe-wrapper {
            width: 100%;
            max-width: 1400px;
            height: calc(100vh - 140px);
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1.5em;
            z-index: 1;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .header p {
                font-size: 0.9em;
            }
            
            .iframe-wrapper {
                height: calc(100vh - 120px);
                border-radius: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎬 Studio Scène</h1>
        <p>Application de continuité visuelle 4K avec IA</p>
    </div>
    
    <div class="app-container">
        <div class="loading" id="loading">Chargement de l'application...</div>
        <div class="iframe-wrapper">
            <iframe 
                src="https://studio-sc-ne-159307107966.us-west1.run.app" 
                allow="camera; microphone; clipboard-read; clipboard-write"
                onload="document.getElementById('loading').style.display='none'">
            </iframe>
        </div>
    </div>
</body>
</html>
